<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="透過角色、任務、限制與呈現方式四個維度，快速檢視並改善 Prompt。">
  <title>Prompt 品質健診器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{font-family:'Noto Sans TC',sans-serif;color:#3a3834;background:#f5f3ee;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}body{margin:0;padding:32px 16px}.page{max-width:960px;margin:auto}header{display:flex;justify-content:space-between;align-items:end;gap:16px;border-bottom:1px solid #d8d4cb;padding-bottom:20px;margin-bottom:24px}h1,h2,h3{font-family:'Shippori Mincho',serif;color:#2b2926}h1{font-size:30px;margin:0}h2{font-size:20px;margin:0}p{line-height:1.65}.eyebrow,.muted{color:#7f7a70}.eyebrow{font-size:12px;letter-spacing:.16em;margin:0 0 5px}.intro{font-size:14px;color:#6e6a61;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:#fff;border:1px solid #d8d4cb;border-radius:6px;padding:22px}.field-head,.result-head,.dimension-head,.suggestion-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.field-head{margin-bottom:10px}label{font-family:'Shippori Mincho',serif;font-weight:600;font-size:18px}textarea{display:block;width:100%;min-height:250px;resize:vertical;padding:14px;border:1px solid #d8d4cb;border-radius:6px;font:inherit;line-height:1.7;color:#2b2926}textarea:focus,button:focus-visible{outline:2px solid #7f7a70;outline-offset:2px}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid #ebe8e0;padding-top:16px;margin-top:16px}.button-group{display:flex;gap:8px}button{font:inherit;border:1px solid #d8d4cb;border-radius:6px;padding:9px 13px;background:#f5f3ee;color:#3a3834;cursor:pointer}button:hover{background:#ebe8e0}.primary{background:#3a3834;color:#fff;border-color:#3a3834;padding-inline:24px}.primary:hover{background:#54514b}.result-head{border-bottom:1px solid #ebe8e0;padding-bottom:16px;margin-bottom:20px}.score{font:700 36px 'Shippori Mincho',serif;color:#2b2926}.badge{display:inline-block;padding:5px 10px;border:1px solid #d8d4cb;border-radius:6px;font-size:13px;background:#f5f3ee}.dimensions{display:grid;gap:18px}.dimension-head{font-size:14px;margin-bottom:7px}.dim-label{font-weight:500}.bar-track{height:12px;border:1px solid #d8d4cb;border-radius:6px;background:#f5f3ee;overflow:hidden}.bar{height:100%;width:0;border-radius:6px;transition:width .4s ease}.match{font-size:11px;color:#7f7a70;margin:5px 0 0;min-height:18px}.scale{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-top:1px solid #ebe8e0;padding-top:13px;margin-top:22px;font-size:11px;color:#7f7a70}.suggestions{grid-column:1/-1}.suggestions h2{margin-bottom:14px}.suggestion-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.suggestion{background:#f5f3ee;border:1px solid #d8d4cb;border-left:4px solid #b5703a;border-radius:6px;padding:14px}.suggestion h3{font-size:16px;margin:8px 0}.suggestion p{font-size:13px;margin:8px 0}.example{background:white;border:1px solid #d8d4cb;border-radius:6px;padding:10px;font-size:12px}.notice{padding:10px 12px;border:1px solid #b5703a;background:#fff;border-radius:6px;margin-bottom:16px;font-size:14px}.hidden{display:none!important}footer{text-align:center;margin-top:24px;font-size:12px;color:#7f7a70}@media(max-width:700px){body{padding:20px 12px}header{align-items:flex-start;flex-direction:column}h1{font-size:25px}.grid,.suggestion-list{grid-template-columns:1fr}.suggestions{grid-column:auto}.card{padding:17px}.score{font-size:30px}}
  </style>
</head>
<body>
  <div class="page">
    <header><div><p class="eyebrow">PROMPT QUALITY DIAGNOSTIC TOOL</p><h1>Prompt 品質健診器</h1></div><p class="intro">透過結構化四維度檢視，讓每一次與 AI 的對話更精準。</p></header>
    <div id="messageBox" class="notice hidden" role="alert" aria-live="polite"></div>
    <main class="grid">
      <section class="card" aria-labelledby="inputTitle">
        <div class="field-head"><label id="inputTitle" for="promptInput">輸入 Prompt 內容</label><span id="charCount" class="muted">0 字</span></div>
        <textarea id="promptInput" placeholder="請在此貼入您撰寫的 Prompt...&#10;&#10;例如：你是一位資深產品經理，請整理使用者訪談紀錄中的核心痛點。" aria-describedby="charCount"></textarea>
        <div class="actions"><div class="button-group"><button type="button" id="sampleBtn">填入範例</button><button type="button" id="clearBtn">清空內容</button></div><button type="button" id="diagnoseBtn" class="primary">健診</button></div>
      </section>
      <section class="card" aria-labelledby="resultTitle">
        <div class="result-head"><div><h2 id="resultTitle">綜合診斷結果</h2><p class="muted" style="font-size:12px;margin:4px 0 0">滿分 100 分（四個維度各佔 25 分）</p></div><div style="text-align:right"><span id="totalScore" class="score">--</span><span class="muted" style="font-size:12px"> / 100</span><div><span id="gradeBadge" class="badge">尚未檢測</span></div></div></div>
        <div id="dimensions" class="dimensions"></div>
        <div class="scale"><span>評級標準：</span><span>90+ 優秀</span><span>70–89 良好</span><span>50–69 尚可</span><span>50 以下 需加強</span></div>
      </section>
      <section class="card suggestions" aria-labelledby="suggestionsTitle"><div class="suggestion-head"><h2 id="suggestionsTitle">具體改善建議</h2><span id="suggestionStatus" class="muted" style="font-size:12px">按下「健診」後將依據低分項目提供優化方向</span></div><div id="suggestionsContainer" class="suggestion-list"><div class="muted" style="grid-column:1/-1;text-align:center;padding:18px">尚未進行診斷。請輸入 Prompt 並點擊「健診」。</div></div></section>
    </main>
    <footer>Prompt 結構化品質評估工具・簡約無印設計</footer>
  </div>
  <script>
    'use strict';
    const DIMENSIONS = [
      {id:'role',name:'① 角色清晰度',color:'#b5703a',hint:'偵測關鍵字：你是、扮演、角色、身分...',primary:['你是','扮演','角色','身分','身份','身為'],secondary:['專家','顧問','老師','工程師','分析師','編輯','助理','立場','視角'],title:'補強「角色清晰度」：賦予 AI 明確的專業視角',description:'目前缺少明確的角色設定。建議在開頭加入具體的專業身分與經驗，讓 AI 從明確的視角回答。',example:'你是一位資深商業分析師，擅長從使用者回饋中提煉產品策略。'},
      {id:'task',name:'② 任務明確度',color:'#c9963a',hint:'偵測關鍵字：寫、整理、分析、生成、製作...',primary:['寫','整理','分析','生成','製作'],secondary:['撰寫','歸納','總結','評估','翻譯','比較','設計','規劃','改寫','提供','列出','解釋'],title:'強化「任務明確度」：使用具體的行動動詞指令',description:'任務指令較為模糊或缺乏明確動詞。請具體指出希望 AI 執行的動作、處理的資料與預期目標。',example:'請分析以下三份會議紀錄，並整理出五項最急迫的待辦事項。'},
      {id:'constraint',name:'③ 限制完整度',color:'#5a7a5a',hint:'偵測關鍵字：不要、避免、限制、字數、語氣...',primary:['不要','避免','限制','字數','語氣'],secondary:['不可','禁止','勿','僅限','控制在','以內','左右','風格','口吻','對象','受眾','條件'],title:'補充「限制完整度」：設定邊界條件與語氣規範',description:'缺少對輸出內容的限制條件。建議加入字數、語氣、受眾或內容範圍等要求，避免回答偏離預期。',example:'語氣請保持客觀專業，避免使用艱澀術語，總字數限制在 300 字以內。'},
      {id:'format',name:'④ 呈現具體度',color:'#6b7fa3',hint:'偵測關鍵字：格式、條列、表格、範本、範例...',primary:['格式','條列','表格','範本','範例'],secondary:['清單','項目符號','分段','標題','Markdown','JSON','步驟','結構','模板','輸出如下'],title:'提升「呈現具體度」：指定結構化的輸出排版',description:'未指定輸出排版方式。建議明確要求使用條列、表格或提供輸出範本，讓結果更容易閱讀與使用。',example:'請以 Markdown 表格格式輸出，欄位包含：問題點、影響程度、建議對策。'}
    ];
    const $ = id => document.getElementById(id);
    const input = $('promptInput');
    const dimensionsEl = $('dimensions');
    function scoreDimension(text, dim) {
      const primary = dim.primary.filter(word => text.includes(word));
      const secondary = dim.secondary.filter(word => text.includes(word));
      let score = primary.length ? 16 + (primary.length - 1) * 4.5 + secondary.length * 2.5 : Math.min(14, secondary.length * 5);
      return {score:Math.min(25, Math.max(0, Math.round(score))),matched:[...primary,...secondary]};
    }
    function makeDimensionRows() {
      dimensionsEl.replaceChildren();
      DIMENSIONS.forEach(dim => {
        const row = document.createElement('div');
        row.innerHTML = `<div class="dimension-head"><span class="dim-label"><span style="color:${dim.color}">●</span> ${dim.name}</span><span><b id="score-${dim.id}">0</b> / 25 分</span></div><div class="bar-track" role="progressbar" aria-label="${dim.name}" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0"><div class="bar" id="bar-${dim.id}" style="background:${dim.color}"></div></div><p class="match" id="match-${dim.id}"></p>`;
        dimensionsEl.append(row);
        $(`match-${dim.id}`).textContent = dim.hint;
      });
    }
    function diagnose() {
      const text = input.value.trim();
      const message = $('messageBox');
      if (!text) { message.textContent = '請先輸入或貼上您要檢測的 Prompt 內容。'; message.classList.remove('hidden'); input.focus(); return; }
      message.classList.add('hidden');
      const results = DIMENSIONS.map(dim => ({dim,...scoreDimension(text,dim)}));
      const total = results.reduce((sum,item) => sum + item.score,0);
      results.forEach(({dim,score,matched}) => {
        $(`score-${dim.id}`).textContent = score;
        const bar = $(`bar-${dim.id}`); bar.style.width = `${score * 4}%`; bar.parentElement.setAttribute('aria-valuenow',score);
        $(`match-${dim.id}`).textContent = matched.length ? `已偵測：「${matched.join('」、「')}」` : `未偵測到相關關鍵詞（建議包含：${dim.primary.join('、')}）`;
      });
      $('totalScore').textContent = total;
      const badge = $('gradeBadge');
      const grade = total >= 90 ? ['優秀','#5a7a5a'] : total >= 70 ? ['良好','#6b7fa3'] : total >= 50 ? ['尚可','#c9963a'] : ['需加強','#b5703a'];
      badge.textContent = grade[0]; badge.style.cssText = `background:${grade[1]};color:white;border-color:${grade[1]}`;
      renderSuggestions(results);
    }
    function renderSuggestions(results) {
      const weak = results.filter(item => item.score < 20).sort((a,b) => a.score - b.score);
      const container = $('suggestionsContainer'); container.replaceChildren();
      if (!weak.length) {
        $('suggestionStatus').textContent = '四個維度皆已具備完整結構';
        const note = document.createElement('p'); note.className = 'muted'; note.style.cssText = 'grid-column:1/-1;text-align:center;padding:18px'; note.textContent = '結構完整！您的指令已涵蓋角色定位、明確任務、邊界限制與具體呈現格式。'; container.append(note); return;
      }
      $('suggestionStatus').textContent = `發現 ${weak.length} 個可加強維度（依優先順序排列）`;
      weak.forEach(({dim,score}) => {
        const card = document.createElement('article'); card.className = 'suggestion'; card.style.borderLeftColor = dim.color;
        const heading = document.createElement('div'); heading.style.cssText = `font-size:12px;font-weight:700;color:${dim.color}`; heading.textContent = `${dim.name}・${score === 0 ? '缺失項目（0 分）' : `尚可補強（${score} / 25 分）`}`;
        const title = document.createElement('h3'); title.textContent = dim.title;
        const description = document.createElement('p'); description.textContent = dim.description;
        const example = document.createElement('div'); example.className = 'example'; example.textContent = `參考句型：${dim.example}`;
        card.append(heading,title,description,example); container.append(card);
      });
    }
    function reset() {
      input.value = ''; $('charCount').textContent = '0 字'; $('messageBox').classList.add('hidden');
      $('totalScore').textContent = '--'; $('gradeBadge').textContent = '尚未檢測'; $('gradeBadge').style.cssText = '';
      DIMENSIONS.forEach(dim => { $(`score-${dim.id}`).textContent = '0'; $(`bar-${dim.id}`).style.width = '0%'; $(`bar-${dim.id}`).parentElement.setAttribute('aria-valuenow','0'); $(`match-${dim.id}`).textContent = dim.hint; });
      $('suggestionStatus').textContent = '按下「健診」後將依據低分項目提供優化方向';
      const empty = document.createElement('div'); empty.className = 'muted'; empty.style.cssText = 'grid-column:1/-1;text-align:center;padding:18px'; empty.textContent = '尚未進行診斷。請輸入 Prompt 並點擊「健診」。'; $('suggestionsContainer').replaceChildren(empty);
    }
    makeDimensionRows();
    input.addEventListener('input', () => { $('charCount').textContent = `${input.value.trim().length} 字`; if (input.value.trim()) $('messageBox').classList.add('hidden'); });
    $('diagnoseBtn').addEventListener('click',diagnose);
    $('sampleBtn').addEventListener('click',() => { input.value = '你是一位職涯顧問，請分析遠距工作的優缺點，整理成條列清單。請以客觀、易懂的語氣撰寫，控制在 500 字以內。'; input.dispatchEvent(new Event('input')); diagnose(); });
    $('clearBtn').addEventListener('click',reset);
  </script>
</body>
</html>
